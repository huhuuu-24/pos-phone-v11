```yaml
appId: com.phonestore.pos
productName: Phone Store POS

directories:
  output: release

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

  createDesktopShortcut: true
  createStartMenuShortcut: true

  shortcutName: Phone Store POS

  installerLanguages:
    - zh_CN
    - en_US

  language: 2052

  runAfterFinish: true

  deleteAppDataOnUninstall: false

artifactName: PhoneStorePOS-Setup-${version}.${ext}
```
